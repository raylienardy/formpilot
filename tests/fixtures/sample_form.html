<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sample Form</title>
</head>
<body>
  <form>
    <div role="main">
      <!-- Q1: Short text, required -->
      <div role="listitem">
        <div role="heading" aria-level="3">
          Nama lengkap Anda?
          <span aria-label="Wajib">*</span>
        </div>
        <input type="text" aria-label="Jawaban Anda" />
      </div>

      <!-- Q2: Radio, not required -->
      <div role="listitem">
        <div role="heading" aria-level="3">Pilih jurusan:</div>
        <div role="radiogroup">
          <div role="radio" aria-label="Teknik Informatika">Teknik Informatika</div>
          <div role="radio" aria-label="Sistem Informasi">Sistem Informasi</div>
          <div role="radio" aria-label="DKV">DKV</div>
        </div>
      </div>

      <!-- Q3: Paragraph, required -->
      <div role="listitem">
        <div role="heading" aria-level="3">
          Berikan saran Anda:
          <span aria-label="Wajib">*</span>
        </div>
        <textarea aria-label="Jawaban Anda"></textarea>
      </div>

      <!-- Q4: Checkbox, not required -->
      <div role="listitem">
        <div role="heading" aria-level="3">Minat (pilih semua):</div>
        <div role="group">
          <div role="checkbox" aria-label="Programming">Programming</div>
          <div role="checkbox" aria-label="Design">Design</div>
          <div role="checkbox" aria-label="Data">Data</div>
        </div>
      </div>

      <!-- Q5: Linear scale -->
      <div role="listitem">
        <div role="heading" aria-level="3">Seberapa puas Anda?</div>
        <div role="radiogroup">
          <div role="radio" aria-label="1">1</div>
          <div role="radio" aria-label="2">2</div>
          <div role="radio" aria-label="3">3</div>
          <div role="radio" aria-label="4">4</div>
          <div role="radio" aria-label="5">5</div>
        </div>
      </div>

      <!-- Q6: With image (has_media=True) -->
      <div role="listitem">
        <div role="heading" aria-level="3">Amati gambar berikut:</div>
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="sample" width="100" height="100" />
        <input type="text" />
      </div>
    </div>

    <!-- Submit button (last page) -->
    <div role="button">Kirim</div>
  </form>
</body>
</html>
