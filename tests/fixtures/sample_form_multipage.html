<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Multi-Page with Required</title></head>
<body>
  <div role="main">
    <div id="page1" data-page="1">
      <div role="listitem">
        <div role="heading" aria-level="3">
          Nama lengkap?
          <span class="freebirdFormviewerComponentsQuestionBaseRequiredAsterisk">*</span>
        </div>
        <input type="text" id="q1-input" aria-label="Jawaban Anda" />
      </div>
      <div role="button" id="next1" aria-disabled="true" onclick="tryNext()">Berikutnya</div>
    </div>

    <div id="page2" data-page="2" hidden>
      <div role="listitem">
        <div role="heading" aria-level="3">Jurusan?</div>
        <div role="radiogroup">
          <div role="radio" aria-label="TI">TI</div>
          <div role="radio" aria-label="SI">SI</div>
        </div>
      </div>
      <div role="button" id="next2" onclick="showPage(3)">Berikutnya</div>
    </div>

    <div id="page3" data-page="3" hidden>
      <div role="listitem">
        <div role="heading" aria-level="3">Saran:</div>
        <textarea></textarea>
      </div>
      <div role="button" id="submit" onclick="submitForm()">Kirim</div>
    </div>
  </div>

  <script>
    document.getElementById('q1-input').addEventListener('input', function() {
      var btn = document.getElementById('next1');
      if (this.value) { btn.setAttribute('aria-disabled', 'false'); }
      else { btn.setAttribute('aria-disabled', 'true'); }
    });
    function tryNext() {
      if (document.getElementById('next1').getAttribute('aria-disabled') === 'false') {
        showPage(2);
      }
    }
    function showPage(n) {
      document.querySelectorAll('[data-page]').forEach(function(el) { el.hidden = true; });
      var t = document.querySelector('[data-page="' + n + '"]');
      if (t) { t.hidden = false; }
    }
    function submitForm() {
      document.getElementById('submit').setAttribute('data-submitted', 'true');
    }
  </script>
</body>
</html>
