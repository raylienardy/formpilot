# FormPilot Configuration Example
# Salin ke config/production.yaml. File itu TIDAK di-commit.

ollama:
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b-instruct"
  embedding_model: "nomic-embed-text"
  temperature: 0.3
  timeout_seconds: 60

browser:
  headless: true
  user_data_dir: "./state/browser_profile"
  timeout_ms: 30000

memory:
  sqlite_path: "./memory.db"
  chroma_path: "./chroma"

cli:
  auto_submit: false          # JANGAN ubah ke true tanpa paham risiko
  batch_questions: true
  language: "id"

logging:
  level: "INFO"               # DEBUG | INFO | WARNING | ERROR
  file: "./logs/formpilot.log"
